name: Deploy to Github Pages

on:
  push:
    branches:
      - main
      - master

# The deploy step pushes a gh-pages branch, so GITHUB_TOKEN needs to be able to
# write to the repo. Without this it defaults to read-only and the job fails at
# the very last command with "Permission to amatiasq/flocking.git denied to
# github-actions[bot]" — which is exactly what happened, silently, from the day
# this project was renamed and started mirroring to a fresh repository.
permissions:
  contents: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run test-with-coverage
      - run: bun run build
      - run: cp -r ./coverage dist/coverage

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      - name: Deploy coverage
        uses: codecov/codecov-action@v4
        with:
          # token: ${{ secrets.CODECOV_TOKEN }} # not required for public repos
          file: ./coverage/clover.xml # optional
          name: flocking # optional
